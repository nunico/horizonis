name: CI

# Static analysis, type-checking and tests for every change landing on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, lint & test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Required to compile the Tauri (Rust) crate for `cargo test` and the
      # `clippy` lint target on `horizonis-shell`.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      # Installs node, pnpm and rust exactly as pinned in mise.toml / mise.lock.
      - name: Set up toolchains (mise)
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `check`  -> svelte-check (type-checking)
      # `lint`   -> eslint + prettier + cargo clippy
      # `test`   -> vitest unit tests
      - name: Type-check, lint & unit test
        run: pnpm nx run-many --targets=check,lint,test

      - name: Rust tests
        run: cargo test --workspace --locked
