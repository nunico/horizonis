name: CI

# Static analysis, type-checking and tests for every change landing on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Required to compile the Tauri (Rust) crate for `cargo test` and the
      # `clippy` lint target on `horizonis-shell`.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      # Installs node, pnpm and packages
      - uses: pnpm/setup@v1
        with:
          cache: true

      # `check`  -> svelte-check (type-checking)
      # `lint`   -> eslint + prettier + cargo clippy
      # `test`   -> vitest unit tests + cargo tests
      - name: Type-check, lint & unit test
        run: pnpm nx run-many --targets=check,lint,test
