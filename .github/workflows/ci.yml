name: CI

# Static analysis, type-checking and tests for every change landing on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, lint & test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build internal WASM package
        run: wasm-pack build --target web -- --features wasm
        working-directory: ./libs/procedural-gen

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev

      # Installs node, pnpm and packages
      - uses: pnpm/setup@v1
        with:
          cache: true

      # `check`  -> svelte-check (type-checking)
      # `lint`   -> eslint + prettier + cargo clippy
      # `test`   -> vitest unit tests + cargo tests
      - name: Type-check, lint & unit test
        run: pnpm nx run-many --targets=check,lint,test
