packages:
  - 'apps/*'
  - 'libs/*'
# Don't auto-run `pnpm install` before every `pnpm <script>` / `pnpm nx ...`.
# Without this, pnpm reconciles node_modules on each run and, in a
# non-interactive shell, aborts on the modules-purge confirmation. Disabling it
# lets the package.json scripts (test/lint/check/dev) run directly.
verifyDepsBeforeRun: false
confirmModulesPurge: false
# Build scripts pnpm is allowed to run on install (replaces the interactive
# approve-builds prompt).
allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  nx: true
  sharp: true
  unrs-resolver: true
